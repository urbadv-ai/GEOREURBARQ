name: MG853 G5 L03 selected values snapshot
on:
  push:
    branches: [ main ]
    paths:
      - 'mg853-g5-block1/imrs_selected_values_snapshot.py'
      - '.github/workflows/mg853-g5-l03-selected-values.yml'
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python mg853-g5-block1/imrs_selected_values_snapshot.py
      - if: always()
        run: zip -r MG853_G5_L03_SELECTED_VALUES_SNAPSHOT_V2_20260807.zip mg853-g5-block1/output/G5-L03_SELECTED_VALUES_V2 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MG853_G5_L03_SELECTED_VALUES_SNAPSHOT_V2_20260807
          path: MG853_G5_L03_SELECTED_VALUES_SNAPSHOT_V2_20260807.zip
          if-no-files-found: warn
          retention-days: 30
