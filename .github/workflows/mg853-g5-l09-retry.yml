name: MG 853 G5 L09 Aquisição Habitacional Resiliente

on:
  push:
    paths:
      - 'mg853-g5-download/retry_l09.py'
      - '.github/workflows/mg853-g5-l09-retry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-l09:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 lxml
      - name: Acquire official housing sources with retries
        run: python mg853-g5-download/retry_l09.py
      - name: Display controlled results
        if: always()
        run: |
          cat mg853-g5-download/output/resumo_execucao.json || true
          cat mg853-g5-download/output/erros_download.csv || true
      - name: Upload resilient L09 package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mg853-G5-L09-fontes-oficiais-retry-20260806
          path: |
            mg853-g5-download/output/G5-L09
            mg853-g5-download/output/manifesto_downloads.csv
            mg853-g5-download/output/manifesto_downloads.json
            mg853-g5-download/output/erros_download.csv
            mg853-g5-download/output/correlacao_semantica_g5_l01_l09.csv
            mg853-g5-download/output/resumo_execucao.json
            mg853-g5-download/output/README_EXECUCAO.md
          if-no-files-found: error
          retention-days: 90
