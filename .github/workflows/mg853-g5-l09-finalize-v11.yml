name: MG 853 G5 L09 Finalizar V1.1

on:
  push:
    paths:
      - 'mg853-g5-block1/finalize_l09_v11.py'
      - '.github/workflows/mg853-g5-l09-finalize-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests pandas openpyxl xlrd
      - run: python mg853-g5-block1/finalize_l09_v11.py
      - if: always()
        run: |
          cat mg853-g5-block1/normalized/G5-L09/resumo_execucao_v1_1.json || true
          cat mg853-g5-block1/normalized/G5-L09/02_AUDITORIA/MG853_G5_L09_AUDITORIA_PRECISAO_MONETARIA_V1_1.csv || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mg853-G5-L09-normalized-v1-1-final-20260807
          path: mg853-g5-block1/normalized/G5-L09
          if-no-files-found: error
          retention-days: 90
