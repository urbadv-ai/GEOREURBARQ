name: MG 853 G5 L04 Finalizar RREO 2025 V0.2

on:
  push:
    paths:
      - 'mg853-g5-block1/finalize_l04_2025_v02.py'
      - '.github/workflows/mg853-g5-l04-finalize-2025-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests pandas
      - run: python mg853-g5-block1/finalize_l04_2025_v02.py
      - if: always()
        run: |
          cat mg853-g5-block1/normalized/G5-L04_2025_V02/resumo_execucao_final.json || true
          cat mg853-g5-block1/normalized/G5-L04_2025_V02/02_AUDITORIA/MG853_G5_L04_COBERTURA_METRICAS_RREO_2025_V0_2.csv || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mg853-G5-L04-RREO-2025-v0-2-final-20260807
          path: mg853-g5-block1/normalized/G5-L04_2025_V02
          if-no-files-found: error
          retention-days: 90
