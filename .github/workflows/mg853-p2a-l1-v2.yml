name: MG 853 P2A Lote 1 Territorio e Censo V2

on:
  pull_request:
    paths:
      - 'mg853-p2a-l1-v2/**'
      - 'mg853-p2a-l1/finalize.py'
  workflow_dispatch:
  schedule:
    - cron: '30 7 2 * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas openpyxl xlrd requests beautifulsoup4 lxml geopandas pyogrio shapely pyarrow
      - name: Extract collector from canonical workflow and run
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests, textwrap
          url='https://raw.githubusercontent.com/urbadv-ai/GEOREURBARQ/main/.github/workflows/mg853-p2a-l1.yml'
          text=requests.get(url,timeout=120).text
          marker="cat > mg853-p2a-l1/collect.py <<'PY'\n"
          body=text.split(marker,1)[1].split("\n          PY\n",1)[0]
          Path('mg853-p2a-l1').mkdir(parents=True,exist_ok=True)
          Path('mg853-p2a-l1/collect.py').write_text(textwrap.dedent(body),encoding='utf-8')
          PY
          mkdir -p mg853-p2a-l1/output/raw mg853-p2a-l1/output/normalized mg853-p2a-l1/output/audit
          python mg853-p2a-l1/collect.py
      - name: Build final audited package and split raw snapshots
        run: |
          python mg853-p2a-l1/finalize.py
          cd mg853-p2a-l1
          zip -qr P2A_LOTE1_NORMALIZADO_AUDITADO_V1_0.zip final
          mkdir -p raw_split
          cd output/raw
          zip -q ../../raw_split/RAW_01_GEOESPACIAL_P2A_LOTE1.zip MG_Municipios_2025.zip poligonos_FCUs_shp.zip FCUs_nao_setorizadas_shp_20260410.zip FCUs_nao_setorizadas_kml_20260410.zip
          zip -q ../../raw_split/RAW_02_ENTORNO_PERCENTUAIS_P2A_LOTE1.zip br_setores_entorno_cd2022_percentuais.csv
          zip -q ../../raw_split/RAW_03_ENTORNO_SETOR_E_DICIONARIOS_P2A_LOTE1.zip entorno_set_domicilios.zip entorno_set_faces.zip entorno_set_moradores.zip entorno_mun_domicilios.zip entorno_mun_faces.zip entorno_mun_moradores.zip entorno_dicionario.zip
          zip -q ../../raw_split/RAW_04_AGREGADOS_AREAS_E_FCU_P2A_LOTE1.zip agg_municipio_Agregados_por_municipios_basico_BR_20260520.zip agg_municipio_Agregados_por_municipios_caracteristicas_domicilio1_BR.zip agg_setor_Agregados_por_setores_basico_BR_20260520.zip agg_setor_Agregados_por_setores_caracteristicas_domicilio1_BR.zip AR_BR_RG_UF_RGINT_RGI_MUN_2025.xls FavelaseComunidadesUrbanas2022Setores_20250417.xlsx
      - name: Upload final audited artifact
        uses: actions/upload-artifact@v4
        with:
          name: mg853-p2a-l1-final-audited-v1
          path: mg853-p2a-l1/P2A_LOTE1_NORMALIZADO_AUDITADO_V1_0.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload raw geospatial snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mg853-p2a-l1-raw-01-geospatial
          path: mg853-p2a-l1/raw_split/RAW_01_GEOESPACIAL_P2A_LOTE1.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload raw entorno percentuais snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mg853-p2a-l1-raw-02-entorno-percentuais
          path: mg853-p2a-l1/raw_split/RAW_02_ENTORNO_PERCENTUAIS_P2A_LOTE1.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload raw entorno setor snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mg853-p2a-l1-raw-03-entorno-setor
          path: mg853-p2a-l1/raw_split/RAW_03_ENTORNO_SETOR_E_DICIONARIOS_P2A_LOTE1.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload raw agregados areas FCU snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mg853-p2a-l1-raw-04-agregados-areas-fcu
          path: mg853-p2a-l1/raw_split/RAW_04_AGREGADOS_AREAS_E_FCU_P2A_LOTE1.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload normalized and audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: mg853-p2a-l1-normalized-audit-v2
          path: |
            mg853-p2a-l1/output/normalized
            mg853-p2a-l1/output/audit
          if-no-files-found: error
          retention-days: 90
      - name: Upload raw snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: mg853-p2a-l1-raw-snapshot-v2
          path: mg853-p2a-l1/output/raw
          if-no-files-found: error
          retention-days: 90
