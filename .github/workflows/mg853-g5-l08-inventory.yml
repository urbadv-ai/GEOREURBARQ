name: MG 853 G5 L08 SIGMINE Inventário Geoespacial

on:
  push:
    paths:
      - 'mg853-g5-block2/inventory_l08_sigmine.py'
      - '.github/workflows/mg853-g5-l08-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests geopandas pyogrio shapely odfpy
      - run: python mg853-g5-block2/inventory_l08_sigmine.py
      - if: always()
        run: cat mg853-g5-block2/output/G5-L08/01_AUDITORIA/MG853_G5_L08_INVENTARIO_E_AUDITORIA_ESTRUTURAL_V1_0.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mg853-G5-L08-inventario-geoespacial-20260807
          path: mg853-g5-block2/output/G5-L08
          if-no-files-found: error
          retention-days: 90
