name: MG 853 G5 L08 Normalizar SIGMINE V1.3

on:
  push:
    paths:
      - 'mg853-g5-block2/normalize_l08_sigmine_v13_wrapper.py'
      - '.github/workflows/mg853-g5-l08-normalize-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests pandas geopandas pyogrio shapely pyproj rtree
      - run: python mg853-g5-block2/normalize_l08_sigmine_v13_wrapper.py
      - if: always()
        run: |
          cat mg853-g5-block2/normalized/G5-L08_V13/resumo_execucao_final.json || true
          du -sh mg853-g5-block2/normalized/G5-L08_V13 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mg853-G5-L08-normalized-v1-3-final-20260807
          path: mg853-g5-block2/normalized/G5-L08_V13
          if-no-files-found: error
          retention-days: 90
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mg853-G5-L08-promocao-v1-3-20260807
          path: |
            mg853-g5-block2/normalized/G5-L08_V13/01_BASE_NORMALIZADA
            mg853-g5-block2/normalized/G5-L08_V13/02_AUDITORIA
            mg853-g5-block2/normalized/G5-L08_V13/resumo_execucao.json
            mg853-g5-block2/normalized/G5-L08_V13/resumo_execucao_final.json
          if-no-files-found: error
          retention-days: 90
