name: OCUE Master Execution Register Validation

on:
  push:
    branches: [conteudo-programatico-v1]
    paths:
      - 'observatorio-cidadao-urbano-escolar/pedagogico/governanca/REGISTRO_MESTRE_EXECUCAO_v1_1.json'
      - 'observatorio-cidadao-urbano-escolar/pedagogico/governanca/validate_registro_mestre_execucao.py'
      - '.github/workflows/ocue-registro-mestre-validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate master execution register
        run: python observatorio-cidadao-urbano-escolar/pedagogico/governanca/validate_registro_mestre_execucao.py
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: ocue-registro-mestre-validation
          path: observatorio-cidadao-urbano-escolar/pedagogico/governanca/registro_mestre_validation_report.json
