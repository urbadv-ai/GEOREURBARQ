name: IDSC BR Canonical Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'mg853-p1-id/pipeline/**'
      - 'mg853-p1-id/config/**'
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: write

concurrency:
  group: idsc-br-canonical-main
  cancel-in-progress: true

jobs:
  extract-normalize-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pandas requests urllib3

      - name: Extract, normalize and validate IDSC-BR
        env:
          IDSC_MAX_WORKERS: '8'
        run: python mg853-p1-id/pipeline/idsc_canonical_pipeline.py

      - name: Assert canonical quality gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mg853-p1-id/data/metadata/idsc_quality_checks.json')
          q=json.loads(p.read_text(encoding='utf-8'))
          assert q['status_qualidade']=='APROVADO', q
          assert q['municipios_ibge_total']==5570, q
          assert q['municipios_nacionais_com_codigo_ibge_unico']==5570, q
          assert q['municipios_nacionais_com_17_ods']==5570, q
          assert q['municipios_mg_ibge']==853, q
          assert q['municipios_mg_com_idsc']==853, q
          assert q['municipios_mg_com_17_ods_resumo']==853, q
          assert q['cobertura_ods_detalhada_mg']==853, q
          assert q['cobertura_series_mg']==853, q
          assert q['erros_detalhamento_mg']==0, q
          print(json.dumps(q, ensure_ascii=False, indent=2))
          PY

      - name: Compact lossless layers for Git persistence
        run: python mg853-p1-id/pipeline/compact_for_git.py

      - name: Upload approved canonical snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: idsc-br-canonical-mg853
          path: mg853-p1-id/data
          if-no-files-found: error
          retention-days: 90

      - name: Assert GitHub persistence size policy
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('mg853-p1-id/data')
          limit=100*1024*1024
          oversized=[(str(p),p.stat().st_size) for p in root.rglob('*') if p.is_file() and p.stat().st_size>=limit]
          assert not oversized, oversized
          print('All persistent files are below GitHub 100 MiB hard limit.')
          PY

      - name: Persist approved canonical snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mg853-p1-id/data
          if git diff --cached --quiet; then
            echo "No canonical data changes to persist."
          else
            SNAPSHOT=$(python -c "import json;print(json.load(open('mg853-p1-id/data/metadata/idsc_quality_checks.json'))['snapshot_date'])")
            git commit -m "data(idsc): refresh canonical BR/MG853 snapshot ${SNAPSHOT}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
