name: MG 853 G5 L06 Catálogo Atual SGB MG

on:
  push:
    paths:
      - 'mg853-g5-block2/parse_sgb_mg_current.py'
      - '.github/workflows/mg853-g5-l06-current-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests beautifulsoup4 lxml
      - run: python mg853-g5-block2/parse_sgb_mg_current.py
      - if: always()
        run: cat mg853-g5-block2/output/G5-L06_CURRENT/resumo_execucao.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mg853-G5-L06-current-catalog-20260807
          path: mg853-g5-block2/output/G5-L06_CURRENT
          if-no-files-found: error
          retention-days: 90
