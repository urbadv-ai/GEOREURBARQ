name: MG 853 P2A Lote 1 Dicionario Censo 2022

on:
  pull_request:
    paths:
      - 'mg853-p2a-l1-dictionary/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Download official dictionary
        run: |
          mkdir -p output
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import requests
          url='https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/dicionario_de_dados_agregados_por_setores_censitarios_20260520.xlsx'
          r=requests.get(url,timeout=300); r.raise_for_status()
          p=Path('output/dicionario_de_dados_agregados_por_setores_censitarios_20260520.xlsx'); p.write_bytes(r.content)
          meta={'url':url,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          Path('output/dictionary_manifest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mg853-p2a-l1-censo-dictionary
          path: output
          if-no-files-found: error
          retention-days: 90
