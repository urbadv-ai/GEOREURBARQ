name: MG853 G5 L03 browser API catalog
on:
  push:
    branches: [ main ]
    paths:
      - 'mg853-g5-block1/imrs_browser_api_catalog.py'
      - '.github/workflows/mg853-g5-l03-browser-api-catalog.yml'
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python mg853-g5-block1/imrs_browser_api_catalog.py
      - if: always()
        run: zip -r MG853_G5_L03_BROWSER_API_CATALOG_20260807.zip mg853-g5-block1/output/G5-L03_BROWSER_API_CATALOG || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MG853_G5_L03_BROWSER_API_CATALOG_20260807
          path: MG853_G5_L03_BROWSER_API_CATALOG_20260807.zip
          if-no-files-found: warn
          retention-days: 30
