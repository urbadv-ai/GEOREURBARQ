name: MG 853 G5 L02 SINISA Inventory

on:
  push:
    paths:
      - 'mg853-g5-normalize-l02/inventory_sources.py'
      - '.github/workflows/mg853-g5-l02-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory official SINISA modules
        run: python mg853-g5-normalize-l02/inventory_sources.py
      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mg853-g5-l02-sinisa-inventory-20260807
          path: mg853-g5-normalize-l02/inventory_output
          retention-days: 90
          if-no-files-found: error
