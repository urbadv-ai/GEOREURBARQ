name: MG 853 G5 L03 Descoberta IMRS Focalizada

on:
  push:
    paths:
      - 'mg853-g5-block1/imrs_fast_discovery.py'
      - '.github/workflows/mg853-g5-l03-fast-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests beautifulsoup4 lxml
      - run: python mg853-g5-block1/imrs_fast_discovery.py
      - if: always()
        run: |
          sed -n '1,200p' mg853-g5-block1/output/G5-L03_FAST/endpoint_shortlist.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mg853-G5-L03-fast-discovery-20260807
          path: mg853-g5-block1/output/G5-L03_FAST
          if-no-files-found: error
          retention-days: 90
